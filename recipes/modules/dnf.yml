      # System
      - powertop
      - powerstat
      - distrobox
      - xdg-utils
      - xdg-user-dirs
      - google-noto-emoji-fonts
      - ddcutil # monitor settings

      # Interfaces for system components
      - NetworkManager-tui
      - network-manager-applet
      - manafirewall
