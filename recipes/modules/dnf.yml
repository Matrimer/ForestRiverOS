- type: dnf
  repos:
    nonfree: rpmfusion
    copr:
      - avengemedia/dms

  install:
    packages:
      - blueman

      # nonfree codecs
      - libavcodec-freeworld

      # Essential applications
      - helix
      - foot
      - foot-terminfo

      - newsboat
      

      - imv
      - zathura
      - zathura-cb
      - zathura-djvu
      - zathura-pdf-mupdf
      - zathura-ps
      - mpv
      - mpv-mpris
