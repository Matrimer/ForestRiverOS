---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: forestriveros
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
# base-image: quay.io/fedora-ostree-desktops/base-atomic
# base-image: 'ghcr.io/ublue-os/ucore:stable-nvidia-lts-20260510'
# base-image: 'ghcr.io/ublue-os/ucore:stable-nvidia'

image-version: latest # latest is also supported if you want new updates ASAP

# stages:
  # - name: install_packages
    # from: docker.io/library/rust
    # modules:
      # - type: script
      #   snippets:
      #     - sudo apt-get update && apt-get install -y git cargo build-essentials
      #     - git clone https://github.com/werdxz/portty
      #     - cd portty && cargo build --release

          
        # - "apt-get update && apt-get install -y git xdg-desktop-portal build-essential ninja-build meson libinih-dev libsystemd-dev scdoc"
        # - git clone https://github.com/hunkyburrito/xdg-desktop-portal-termfilechooser
        # - "cd xdg-desktop-portal-termfilechooser && meson build && ninja -C build && ninja -C build install"

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # - type: copy
  #   from: install_packages
  #   src: /out/
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - from-file: modules/remove-unnecessary.yml
  - from-file: modules/nvidia-open.yml
  - from-file: modules/kargs.yml
  - from-file: modules/system-packages.yml
  
  - from-file: modules/dnf.yml
  - from-file: modules/flatpak.yml
  - from-file: modules/brew.yml
  - from-file: modules/soar.yml

  - from-file: modules/systemd.yml


  - type: script
    snippets:
      - "systemctl --user add-wants niri.service dms"
    scripts:
      - setdrmvariables.sh
      # - ensureautoupdates.sh
      # - addimageinfo.sh
  # - type: initramfs
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
